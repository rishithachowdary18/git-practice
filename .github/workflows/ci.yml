name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Installation
        run: |
          python --version
          pip --version

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Application Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Installed Packages
        run: |
          pip list

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Install Build Package
        run: |
          pip install build

      - name: Build Application
        run: |
          python -m build

      - name: Verify Build Artifacts
        run: |
          ls -la dist/

      - name: Deploy Application to Amazon Linux EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2"

            cd /home/ec2-user/app

            echo "Current Directory"
            pwd

            echo "Pulling Latest Code"
            git pull origin main

            echo "Installing Dependencies"
            pip3 install -r requirements.txt

            echo "Restarting Application Service"
            sudo systemctl restart myapp

            echo "Checking Service Status"
            sudo systemctl status myapp --no-pager

      - name: Wait for Application Startup
        run: |
          sleep 20

      - name: Smoke Test Application
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:5000/health
- name: Slack Success Notification
  if: success()
  uses: rtCamp/action-slack-notify@v2
  env:
    SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    SLACK_MESSAGE: "GitHub Actions Pipeline Succeeded"

- name: Slack Failure Notification
  if: failure()
  uses: rtCamp/action-slack-notify@v2
  env:
    SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    SLACK_MESSAGE: "GitHub Actions Pipeline Failed"
     
